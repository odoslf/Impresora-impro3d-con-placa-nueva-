name: Odos3D reliability pass

on:
  push:
    branches: [ odos3d-skr14-tmc2209 ]
    paths:
      - '.github/workflows/reliability-odos3d.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: odos3d-skr14-tmc2209
          fetch-depth: 0

      - name: Apply verified original PID behavior and torque-first TMC mode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Marlin/Configuration_adv.h')
          s=p.read_text(encoding='utf-8')

          def set_define(name, value=None, enabled=True):
              global s
              pat=re.compile(rf'(?m)^(?P<i>[ \t]*)(?://[ \t]*)?#define[ \t]+{re.escape(name)}(?:[ \t]+[^\r\n]*)?$')
              ms=list(pat.finditer(s))
              if len(ms)!=1: raise SystemExit(f'{name}: expected 1 define, got {len(ms)}')
              m=ms[0]
              body=f'#define {name}'+(f' {value}' if value is not None else '')
              repl=m.group('i')+(body if enabled else '//'+body)
              s=s[:m.start()]+repl+s[m.end():]

          # Exact modern equivalent of the original PID_ADD_EXTRUSION_RATE block.
          # Original firmware used Kc=1; LPQ length remains 50.
          set_define('PID_EXTRUSION_SCALING', enabled=True)
          set_define('DEFAULT_KC', '(1)')
          set_define('LPQ_MAX_LEN', '50')

          # Commissioning mode: spreadCycle on every motor actually fitted.
          # This prioritizes torque / step reliability over acoustic quietness,
          # closer to the behavior expected from the old A4988 setup.
          set_define('STEALTHCHOP_XY', enabled=False)
          set_define('STEALTHCHOP_Z', enabled=False)
          set_define('STEALTHCHOP_E', enabled=False)
          set_define('HYBRID_THRESHOLD', enabled=False)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify protected values
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Marlin/Configuration_adv.h').read_text(encoding='utf-8')
          must=['#define PID_EXTRUSION_SCALING','#define DEFAULT_KC (1)','#define LPQ_MAX_LEN 50',
                '#define X_CURRENT 700','#define Y_CURRENT 725','#define Z_CURRENT 670','#define E0_CURRENT 650',
                '#define X_RSENSE 0.11','#define Y_RSENSE 0.11','#define Z_RSENSE 0.11','#define E0_RSENSE 0.11']
          for n in must:
              if n not in s: raise SystemExit('Missing: '+n)
          for n in ['STEALTHCHOP_XY','STEALTHCHOP_Z','STEALTHCHOP_E','HYBRID_THRESHOLD','SENSORLESS_HOMING']:
              if re.search(rf'(?m)^\s*#define\s+{n}(?:\s|$)',s): raise SystemExit('Must be disabled: '+n)
          print('PID scaling and torque-first TMC invariants OK')
          PY

      - name: Install PlatformIO
        run: python3 -m pip install --upgrade platformio

      - name: Compile LPC1769
        run: platformio run -e LPC1769

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reliability-odos3d.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Marlin/Configuration_adv.h .github/workflows/reliability-odos3d.yml
          git commit -m "Preserve original PID extrusion scaling and use spreadCycle"
          git push origin HEAD:odos3d-skr14-tmc2209
