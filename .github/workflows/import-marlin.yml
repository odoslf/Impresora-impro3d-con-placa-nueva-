name: Import official Marlin 2.1.2.8

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-marlin.yml'

permissions:
  contents: write

jobs:
  import-marlin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository contents with official Marlin 2.1.2.8
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch 2.1.2.8 https://github.com/MarlinFirmware/Marlin.git "$tmp/marlin"
          rsync -a --delete --exclude='.git' "$tmp/marlin/" ./
          rm -rf "$tmp"

      - name: Commit official source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import official Marlin 2.1.2.8"
          git push origin HEAD:main
