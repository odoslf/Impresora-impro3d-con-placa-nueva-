name: Port Impro3D legacy behavior

on:
  push:
    branches: [ odos3d-skr14-tmc2209 ]
    paths:
      - '.github/workflows/legacy-behavior-odos3d.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: odos3d-skr14-tmc2209
          fetch-depth: 0

      - name: Port verified original behaviors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one occurrence, got {n}: {old[:100]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          def set_define(path, name, value=None, enabled=True):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              pat = re.compile(rf'(?m)^(?P<i>[ \t]*)(?://[ \t]*)?#define[ \t]+{re.escape(name)}(?:[ \t]+[^\r\n]*)?$')
              ms = list(pat.finditer(s))
              if len(ms) != 1:
                  raise SystemExit(f'{path}:{name}: expected exactly one define, got {len(ms)}')
              m = ms[0]
              body = f'#define {name}' + (f' {value}' if value is not None else '')
              repl = m.group('i') + (body if enabled else '//' + body)
              p.write_text(s[:m.start()] + repl + s[m.end():], encoding='utf-8')

          cfg = 'Marlin/Configuration.h'
          adv = 'Marlin/Configuration_adv.h'

          replace_once(cfg, '#define CUSTOM_MACHINE_NAME "Odos3D-Lab"', '#define CUSTOM_MACHINE_NAME "Odos3D-Lab"\n#define ODOS3D_LEGACY_UI')
          set_define(cfg, 'NOZZLE_PARK_FEATURE', enabled=True)
          set_define(cfg, 'NOZZLE_PARK_POINT', '{ 3, 3, 0 }')
          set_define(cfg, 'NOZZLE_PARK_Z_RAISE_MIN', '10')
          set_define(cfg, 'NOZZLE_PARK_XY_FEEDRATE', '133.3333')
          set_define(cfg, 'NOZZLE_PARK_Z_FEEDRATE', '3.3')

          set_define(adv, 'ADVANCED_PAUSE_FEATURE', enabled=True)
          set_define(adv, 'PAUSE_PARK_RETRACT_FEEDRATE', '5')
          set_define(adv, 'PAUSE_PARK_RETRACT_LENGTH', '2')
          set_define(adv, 'FILAMENT_CHANGE_UNLOAD_FEEDRATE', '5')
          set_define(adv, 'FILAMENT_CHANGE_UNLOAD_ACCEL', '0')
          set_define(adv, 'FILAMENT_CHANGE_UNLOAD_LENGTH', '100')
          set_define(adv, 'FILAMENT_CHANGE_SLOW_LOAD_FEEDRATE', '5')
          set_define(adv, 'FILAMENT_CHANGE_SLOW_LOAD_LENGTH', '0')
          set_define(adv, 'FILAMENT_CHANGE_FAST_LOAD_FEEDRATE', '5')
          set_define(adv, 'FILAMENT_CHANGE_FAST_LOAD_ACCEL', '0')
          set_define(adv, 'FILAMENT_CHANGE_FAST_LOAD_LENGTH', '100')
          set_define(adv, 'ADVANCED_PAUSE_PURGE_FEEDRATE', '5')
          set_define(adv, 'ADVANCED_PAUSE_PURGE_LENGTH', '0')
          set_define(adv, 'ADVANCED_PAUSE_RESUME_PRIME', '0')
          set_define(adv, 'FILAMENT_UNLOAD_PURGE_RETRACT', '0')
          set_define(adv, 'FILAMENT_UNLOAD_PURGE_DELAY', '0')
          set_define(adv, 'FILAMENT_UNLOAD_PURGE_LENGTH', '0')
          set_define(adv, 'FILAMENT_UNLOAD_PURGE_FEEDRATE', '5')
          set_define(adv, 'FILAMENT_CHANGE_ALERT_BEEPS', '-1', enabled=True)
          set_define(adv, 'FILAMENT_LOAD_UNLOAD_GCODES', enabled=True)

          m702_old = "      const float unload_length = -ABS(parser.seen('U') ? parser.value_axis_units(E_AXIS)\n                                                        : fc_settings[target_extruder].unload_length);\n\n      unload_filament(unload_length, true, PAUSE_MODE_UNLOAD_FILAMENT"
          m702_new = "      #if ENABLED(ODOS3D_LEGACY_UI)\n        const float unload_length = -ABS(parser.seen('U') ? parser.value_axis_units(E_AXIS) : 60.0f);\n        unscaled_e_move(10.0f, 5.0f);\n      #else\n        const float unload_length = -ABS(parser.seen('U') ? parser.value_axis_units(E_AXIS)\n                                                          : fc_settings[target_extruder].unload_length);\n      #endif\n\n      unload_filament(unload_length, true, PAUSE_MODE_UNLOAD_FILAMENT"
          replace_once('Marlin/src/gcode/feature/pause/M701_M702.cpp', m702_old, m702_new)

          replace_once('Marlin/src/lcd/menu/menu_bed_tramming.cpp',
                       '    line_to_current_position(manual_feedrate_mm_s.x);',
                       '    #if ENABLED(ODOS3D_LEGACY_UI)\n      line_to_current_position(feedRate_t(8000.0f / 60.0f));\n    #else\n      line_to_current_position(manual_feedrate_mm_s.x);\n    #endif')

          replace_once('Marlin/src/lcd/menu/menu_bed_tramming.cpp',
                       '            line_to_z(BED_TRAMMING_Z_HOP); // Raise Z off the bed when done\n            TERN_(HAS_LEVELING, set_bed_leveling_enabled(menu_leveling_was_active));',
                       '            line_to_z(BED_TRAMMING_Z_HOP); // Raise Z off the bed when done\n            #if ENABLED(ODOS3D_LEGACY_UI)\n              do_blocking_move_to_xy(10, 10, feedRate_t(8000.0f / 60.0f));\n            #endif\n            TERN_(HAS_LEVELING, set_bed_leveling_enabled(menu_leveling_was_active));')

          replace_once('Marlin/src/lcd/HD44780/marlinui_HD44780.cpp',
                       '    //\n    // Show the Marlin logo with splash line 1\n    //',
                       '    #if ENABLED(ODOS3D_LEGACY_UI)\n      lcd_put_u8str(4, 1, F("Odos3D-Lab"));\n      CENTER_OR_SCROLL(SHORT_BUILD_VERSION, 1500);\n      return;\n    #endif\n\n    //\n    // Show the Marlin logo with splash line 1\n    //')
          PY

      - name: Verify migrated behavior invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = {
            'cfg': Path('Marlin/Configuration.h').read_text(encoding='utf-8'),
            'adv': Path('Marlin/Configuration_adv.h').read_text(encoding='utf-8'),
            'm702': Path('Marlin/src/gcode/feature/pause/M701_M702.cpp').read_text(encoding='utf-8'),
            'tram': Path('Marlin/src/lcd/menu/menu_bed_tramming.cpp').read_text(encoding='utf-8'),
            'lcd': Path('Marlin/src/lcd/HD44780/marlinui_HD44780.cpp').read_text(encoding='utf-8'),
          }
          needles = [
            ('cfg', '#define CUSTOM_MACHINE_NAME "Odos3D-Lab"'), ('cfg', '#define ODOS3D_LEGACY_UI'),
            ('cfg', '#define NOZZLE_PARK_FEATURE'), ('cfg', '#define NOZZLE_PARK_POINT { 3, 3, 0 }'),
            ('cfg', '#define NOZZLE_PARK_Z_RAISE_MIN 10'), ('adv', '#define ADVANCED_PAUSE_FEATURE'),
            ('adv', '#define FILAMENT_CHANGE_UNLOAD_LENGTH 100'), ('adv', '#define FILAMENT_CHANGE_FAST_LOAD_LENGTH 100'),
            ('adv', '#define ADVANCED_PAUSE_PURGE_LENGTH 0'), ('adv', '#define FILAMENT_LOAD_UNLOAD_GCODES'),
            ('adv', '#define FILAMENT_CHANGE_ALERT_BEEPS -1'),
            ('m702', 'unscaled_e_move(10.0f, 5.0f);'), ('m702', ': 60.0f);'),
            ('tram', 'feedRate_t(8000.0f / 60.0f)'), ('tram', 'do_blocking_move_to_xy(10, 10'),
            ('lcd', 'F("Odos3D-Lab")')
          ]
          for k,n in needles:
              if n not in files[k]: raise SystemExit(f'Missing {k}: {n}')
          for n in ['#define X_CURRENT 700','#define Y_CURRENT 725','#define Z_CURRENT 670','#define E0_CURRENT 650']:
              if n not in files['adv']: raise SystemExit('Driver current changed: '+n)
          print('Legacy behavior invariants OK')
          PY

      - name: Install PlatformIO
        run: python3 -m pip install --upgrade platformio

      - name: Compile for SKR 1.4 Turbo LPC1769
        run: platformio run -e LPC1769

      - name: Remove temporary workflow and commit validated port
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/legacy-behavior-odos3d.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Marlin/Configuration.h Marlin/Configuration_adv.h Marlin/src/gcode/feature/pause/M701_M702.cpp Marlin/src/lcd/menu/menu_bed_tramming.cpp Marlin/src/lcd/HD44780/marlinui_HD44780.cpp .github/workflows/legacy-behavior-odos3d.yml
          git commit -m "Port original Impro3D filament tramming and LCD behavior"
          git push origin HEAD:odos3d-skr14-tmc2209
