name: Odos3D legacy safety behavior

on:
  push:
    branches: [ odos3d-skr14-tmc2209 ]
    paths:
      - '.github/workflows/legacy-safety-odos3d.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: odos3d-skr14-tmc2209
          fetch-depth: 0

      - name: Apply original level cooling guard and safe M702 sequence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n!=1: raise SystemExit(f'{path}: expected 1 occurrence, got {n}: {old[:120]!r}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          tram='Marlin/src/lcd/menu/menu_bed_tramming.cpp'
          m702='Marlin/src/gcode/feature/pause/M701_M702.cpp'

          old='#include "../../module/planner.h"\n\n#if HAS_LEVELING'
          new='#include "../../module/planner.h"\n#if ENABLED(ODOS3D_LEGACY_UI)\n  #include "../../MarlinCore.h"\n  #include "../../module/temperature.h"\n#endif\n\n#if HAS_LEVELING'
          replace_once(tram,old,new)

          old='void _lcd_bed_tramming() {\n  ui.defer_status_screen();'
          new='void _lcd_bed_tramming() {\n  #if ENABLED(ODOS3D_LEGACY_UI)\n    thermalManager.setTargetHotend(0, 0);\n    if (thermalManager.degHotend(0) >= 60) {\n      #if HAS_FAN0\n        thermalManager.set_fan_speed(0, 255);\n      #endif\n      LCD_MESSAGE(MSG_COOLING);\n      while (thermalManager.degHotend(0) >= 60) idle();\n      #if HAS_FAN0\n        thermalManager.set_fan_speed(0, 0);\n      #endif\n    }\n  #endif\n\n  ui.defer_status_screen();'
          replace_once(tram,old,new)

          old="      #if ENABLED(ODOS3D_LEGACY_UI)\n        const float unload_length = -ABS(parser.seen('U') ? parser.value_axis_units(E_AXIS) : 60.0f);\n        unscaled_e_move(10.0f, 5.0f);\n      #else"
          new="      #if ENABLED(ODOS3D_LEGACY_UI)\n        const float unload_length = -ABS(parser.seen('U') ? parser.value_axis_units(E_AXIS) : 60.0f);\n        load_filament(\n          0, 10.0f, 0, 0,\n          false, false, PAUSE_MODE_UNLOAD_FILAMENT\n          OPTARG(DUAL_X_CARRIAGE, target_extruder)\n        );\n      #else"
          replace_once(m702,old,new)
          PY

      - name: Verify legacy safety invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('Marlin/src/lcd/menu/menu_bed_tramming.cpp').read_text(encoding='utf-8')
          m=Path('Marlin/src/gcode/feature/pause/M701_M702.cpp').read_text(encoding='utf-8')
          a=Path('Marlin/Configuration_adv.h').read_text(encoding='utf-8')
          c=Path('Marlin/Configuration.h').read_text(encoding='utf-8')
          for n in ['thermalManager.setTargetHotend(0, 0);','thermalManager.degHotend(0) >= 60','thermalManager.set_fan_speed(0, 255);','LCD_MESSAGE(MSG_COOLING)','do_blocking_move_to_xy(10, 10','feedRate_t(8000.0f / 60.0f)']:
              if n not in t: raise SystemExit('Missing tramming invariant: '+n)
          for n in ['const float unload_length = -ABS',': 60.0f);','load_filament(','0, 10.0f, 0, 0']:
              if n not in m: raise SystemExit('Missing unload invariant: '+n)
          for n in ['#define X_CURRENT 700','#define Y_CURRENT 725','#define Z_CURRENT 670','#define E0_CURRENT 650','#define PID_EXTRUSION_SCALING','#define DEFAULT_KC (1)']:
              if n not in a: raise SystemExit('Protected value missing: '+n)
          if '#define CUSTOM_MACHINE_NAME "Odos3D-Lab"' not in c: raise SystemExit('Machine name changed')
          print('Legacy cooling and unload safety invariants OK')
          PY

      - name: Install PlatformIO
        run: python3 -m pip install --upgrade platformio

      - name: Compile LPC1769
        run: platformio run -e LPC1769

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/legacy-safety-odos3d.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Marlin/src/lcd/menu/menu_bed_tramming.cpp Marlin/src/gcode/feature/pause/M701_M702.cpp .github/workflows/legacy-safety-odos3d.yml
          git commit -m "Restore Impro3D level cooling guard and safe M702 sequence"
          git push origin HEAD:odos3d-skr14-tmc2209
